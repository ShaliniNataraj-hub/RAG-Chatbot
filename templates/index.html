<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Local RAG Chatbot</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

<div class="app">


    <!-- Sidebar -->

    <aside class="sidebar">

        <div class="logo">
            <div class="logo-icon">R</div>
            <div>
                <h2>Local RAG</h2>
                <span>Qwen3 4B</span>
            </div>
        </div>


        <button class="new-chat"
                onclick="newChat()">

            + New Chat

        </button>


        <div class="sidebar-info">

            <h4>System</h4>

            <div class="status">
                <span class="status-dot"></span>
                Ollama Online
            </div>

            <div class="status">
                <span class="status-dot"></span>
                ChromaDB Ready
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Local Embeddings
            </div>

        </div>


        <div class="model-info">

            <p>MODEL</p>

            <strong>Qwen3 4B</strong>

            <span>Running locally</span>

        </div>

    </aside>



    <!-- Main content -->

    <main class="main">


        <!-- Header -->

        <header class="header">

            <div>

                <h1>Document Assistant</h1>

                <p>
                    Ask questions about your documents
                </p>

            </div>


            <div class="local-badge">

                <span></span>

                LOCAL AI

            </div>

        </header>



        <!-- Chat area -->

        <section class="chat-container"
                 id="chatContainer">


            <!-- Welcome -->

            <div class="welcome"
                 id="welcome">

                <div class="welcome-icon">
                    R
                </div>

                <h2>
                    How can I help you?
                </h2>

                <p>
                    Ask a question about your uploaded
                    documents.
                </p>


                <div class="suggestions">

                    <button onclick="askSuggestion(this)">
                        What is SVM?
                    </button>

                    <button onclick="askSuggestion(this)">
                        What is the optimization problem for SVM?
                    </button>

                    <button onclick="askSuggestion(this)">
                        Explain the SVM margin.
                    </button>

                </div>

            </div>

        </section>



        <!-- Input -->

        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="question"
                    placeholder="Ask something about your documents..."
                    rows="1"></textarea>


                <button
                    id="sendButton"
                    onclick="sendQuestion()">

                    ➤

                </button>

            </div>


            <p class="disclaimer">

                Local RAG • Qwen3 4B • Ollama

            </p>

        </div>


    </main>

</div>


<script src="{{ url_for('static', filename='script.js') }}">
</script>

</body>

</html>
